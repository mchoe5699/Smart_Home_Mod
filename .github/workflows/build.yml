name: Build JAR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: smart_home_mod-jar
          path: build/libs/*.jar

      - name: Publish JAR to build-output branch
        run: |
          mkdir -p /tmp/out && cp build/libs/*.jar /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-output
          git rm -rf . > /dev/null
          rm -rf build .gradle
          cp /tmp/out/*.jar .
          git add *.jar
          git commit -m "Build ${GITHUB_SHA::7}"
          git push -f origin build-output
